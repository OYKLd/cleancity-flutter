name: CI

on:
  push:
    branches: [main, "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  checks:
    name: Format, analyze, test, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # firebase_options.dart is generated by flutterfire and must not be edited.
      - name: Check formatting
        run: |
          git ls-files '*.dart' | grep -v 'lib/firebase_options.dart' \
            | xargs dart format --output=none --set-exit-if-changed \
            || { echo "::error::Run 'dart format lib test' and commit."; exit 1; }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Public repo: block real Rodium keys (doc placeholders like "rd_sk_..." are ignored).
      - name: Check for leaked API keys
        run: |
          if git grep -nE 'rd_sk_[A-Za-z0-9_-]{16,}'; then
            echo "::error::A Rodium API key seems to be committed. Remove and revoke it."
            exit 1
          fi
          if git ls-files --error-unmatch dart_defines.json > /dev/null 2>&1; then
            echo "::error::dart_defines.json must not be committed."
            exit 1
          fi

  build-android:
    name: Build APK (debug)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --dart-define-from-file=dart_defines.example.json
